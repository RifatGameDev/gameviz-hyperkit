name: HyperKit Android Production Release

on:
  workflow_dispatch:
    inputs:
      template:
        description: Built-in game template used for the release build
        required: true
        type: choice
        default: tap-counter
        options:
          - tap-counter
          - flappy-mini
          - swipe-runner
          - puzzle-game
          - quiz-game
          - simple-physics
      project_name:
        description: Generated project directory
        required: true
        default: hyperkit-production-release
        type: string
      title:
        description: Android application title
        required: true
        default: HyperKit Game
        type: string
      package_name:
        description: Android package name segment
        required: true
        default: hyperkitgame
        type: string
      package_domain:
        description: Android package domain
        required: true
        default: org.gameviz
        type: string
      app_version:
        description: Android application version
        required: true
        default: 1.0.1
        type: string

permissions:
  contents: read

jobs:
  production-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: android-production

    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
      PROJECT_DIR: ${{ inputs.project_name }}
      P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up HyperKit tooling Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HyperKit tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate release project
        run: |
          hyperkit new "$PROJECT_DIR" --template "${{ inputs.template }}"

          hyperkit init-android             --path "$PROJECT_DIR"             --title "${{ inputs.title }}"             --package-name "${{ inputs.package_name }}"             --package-domain "${{ inputs.package_domain }}"             --app-version "${{ inputs.app_version }}"             --production             --fullscreen             --permission VIBRATE             --arch arm64-v8a             --overwrite

      - name: Configure protected Android signing inputs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$P4A_RELEASE_KEYSTORE_PASSWD"
          test -n "$P4A_RELEASE_KEYALIAS"
          test -n "$P4A_RELEASE_KEYALIAS_PASSWD"

          KEYSTORE_PATH="$RUNNER_TEMP/hyperkit-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          printf 'P4A_RELEASE_KEYSTORE=%s\n' "$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Validate production Android readiness
        run: hyperkit android-release-doctor --path "$PROJECT_DIR"

      - name: Bundle current HyperKit SDK
        shell: bash
        run: |
          cp -a src/hyperkit "$PROJECT_DIR/hyperkit"

          python - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          path = project / "buildozer.spec"
          text = path.read_text(encoding="utf-8")

          old = "requirements = python3,kivy,gameviz-hyperkit"
          new = "requirements = python3,kivy"

          if old not in text:
              raise SystemExit(
                  "Expected production requirements line was not found."
              )

          path.write_text(
              text.replace(old, new, 1),
              encoding="utf-8",
          )
          PY

          grep -F "android.api = 36" "$PROJECT_DIR/buildozer.spec"
          grep -F "android.ndk = 29" "$PROJECT_DIR/buildozer.spec"
          grep -F "android.release_artifact = aab" "$PROJECT_DIR/buildozer.spec"
          grep -F "p4a.branch = develop" "$PROJECT_DIR/buildozer.spec"
          grep -F "requirements = python3,kivy" "$PROJECT_DIR/buildozer.spec"

      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y             git             zip             unzip             openjdk-17-jdk             python3-virtualenv             autoconf             automake             autopoint             libtool             libltdl-dev             pkg-config             zlib1g-dev             libncurses5-dev             libncursesw5-dev             libtinfo6             cmake             libffi-dev             libssl-dev             gettext             curl

          java -version

      - name: Set up Buildozer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install production Buildozer toolchain
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/kivy/buildozer
          pip install legacy-cgi setuptools cython==0.29.34

          buildozer --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build signed Android release AAB
        working-directory: ${{ inputs.project_name }}
        run: |
          buildozer -v android release

      - name: Verify production AAB artifact
        shell: bash
        run: |
          AAB="$(find "$PROJECT_DIR/bin" -maxdepth 1 -type f -name '*.aab' -print -quit)"

          if [ -z "$AAB" ]; then
            echo "No production AAB was generated."
            exit 1
          fi

          sha256sum "$AAB" | tee "$PROJECT_DIR/bin/SHA256SUMS"

      - name: Upload signed production artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperkit-android-production-aab
          path: |
            ${{ inputs.project_name }}/bin/*.aab
            ${{ inputs.project_name }}/bin/SHA256SUMS
            ${{ inputs.project_name }}/buildozer.spec
          if-no-files-found: error
          retention-days: 30
