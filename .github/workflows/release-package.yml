name: HyperKit Release Package

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Publish destination after verification
        required: true
        type: choice
        default: none
        options:
          - none
          - testpypi
          - pypi
      confirm_pypi:
        description: Confirm intentional real PyPI publication
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run automated tests
        run: pytest -q

      - name: Run release gates
        run: |
          hyperkit health
          hyperkit validate-templates
          hyperkit validate-complete-games
          hyperkit validate-generated-projects
          hyperkit release-check
          hyperkit pre-release-audit

      - name: Validate publishing target and production tag
        shell: bash
        run: |
          hyperkit publish-check --target "${{ inputs.publish_target }}"

          if [ "${{ inputs.publish_target }}" = "pypi" ]; then
            VERSION="$(python -c 'import hyperkit; print(hyperkit.__version__)')"
            EXPECTED_REF="refs/tags/v$VERSION"

            if [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
              echo "Real PyPI publication requires tag $EXPECTED_REF."
              echo "Current ref: $GITHUB_REF"
              exit 1
            fi
          fi

      - name: Configure deterministic build inputs
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "PYTHONHASHSEED=0" >> "$GITHUB_ENV"

      - name: Build clean distribution directory
        run: |
          rm -rf build dist *.egg-info src/*.egg-info
          python -m build

      - name: Run twine validation
        run: python -m twine check dist/*

      - name: Verify distribution artifacts
        run: hyperkit verify-dist

      - name: Create checksums and release manifest
        run: hyperkit release-manifest --source-commit "$GITHUB_SHA"

      - name: Verify fresh wheel installation
        run: hyperkit verify-clean-install

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: hyperkit-release-bundle
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 30

  publish-testpypi:
    if: ${{ inputs.publish_target == 'testpypi' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@v4
        with:
          name: hyperkit-release-bundle
          path: dist

      - name: Prepare package-only TestPyPI upload directory
        run: |
          mkdir -p publish-dist
          cp dist/*.whl publish-dist/
          cp dist/*.tar.gz publish-dist/

      - name: Publish verified artifacts to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: publish-dist/
          skip-existing: false
          verbose: true

  publish-pypi:
    if: ${{ inputs.publish_target == 'pypi' && inputs.confirm_pypi == true }}
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@v4
        with:
          name: hyperkit-release-bundle
          path: dist

      - name: Prepare package-only PyPI upload directory
        run: |
          mkdir -p publish-dist
          cp dist/*.whl publish-dist/
          cp dist/*.tar.gz publish-dist/

      - name: Publish verified artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist/
          skip-existing: false
          verbose: true
