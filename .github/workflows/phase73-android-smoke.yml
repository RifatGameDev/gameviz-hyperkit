name: Phase 73 Android Smoke APK

on:
  workflow_dispatch:

  push:
    branches:
      - feature/phase73-android-mobile

permissions:
  contents: read

jobs:
  build-android-smoke:
    name: Build HyperKit Android Smoke APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
      DEBIAN_FRONTEND: "noninteractive"

    steps:
      - name: Checkout HyperKit
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Android build system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            python3-virtualenv \
            sudo \
            unzip \
            wget \
            zip \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            gettext

      - name: Verify native Android build prerequisites
        run: |
          echo "Checking required build tools..."

          command -v autoconf
          command -v autoreconf
          command -v automake
          command -v aclocal
          command -v libtoolize
          command -v gcc
          command -v g++
          command -v make
          command -v patch
          command -v ant
          command -v java

          echo
          echo "Checking libltdl development package..."

          dpkg -s libltdl-dev

          echo
          echo "Checking Libtool macro..."

          grep -R \
            "LT_SYS_SYMBOL_USCORE" \
            /usr/share/aclocal \
            2>/dev/null \
            | head -5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install HyperKit and Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install -e .

          python -m pip install \
            buildozer \
            setuptools \
            cython==0.29.34

          echo
          echo "HyperKit:"
          hyperkit doctor

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Rust:"
          rustc --version

          echo
          echo "Python:"
          python --version

      - name: Generate HyperKit Android smoke project
        run: |
          rm -rf phase73-android-smoke

          hyperkit new phase73-android-smoke \
            --template tap-counter

          hyperkit init-android \
            --path phase73-android-smoke \
            --title "HyperKit Phase 73" \
            --package-name phase73smoke \
            --package-domain org.gameviz \
            --orientation portrait \
            --fullscreen \
            --permission VIBRATE \
            --arch arm64-v8a \
            --overwrite

      - name: Bundle current HyperKit SDK into Android project
        run: |
          cp -a src/hyperkit phase73-android-smoke/hyperkit

          python - <<'PY'
          from pathlib import Path


          spec_path = Path(
              "phase73-android-smoke/buildozer.spec"
          )

          text = spec_path.read_text(
              encoding="utf-8"
          )

          updated_lines = []

          for line in text.splitlines():
              stripped = line.strip()

              if stripped.startswith(
                  "requirements ="
              ):
                  prefix, values = line.split(
                      "=",
                      1,
                  )

                  requirements = [
                      item.strip()
                      for item in values.split(",")
                      if item.strip()
                  ]

                  requirements = [
                      item
                      for item in requirements
                      if item not in {
                          "gameviz-hyperkit",
                          "gameviz_hyperkit",
                      }
                  ]

                  line = (
                      f"{prefix}= "
                      + ",".join(
                          requirements
                      )
                  )

              updated_lines.append(
                  line
              )

          final_lines = []

          license_added = False

          for line in updated_lines:
              if (
                  line.strip()
                  == "[buildozer]"
                  and not license_added
              ):
                  final_lines.append(
                      "android.accept_sdk_license = True"
                  )

                  final_lines.append(
                      ""
                  )

                  license_added = True

              final_lines.append(
                  line
              )

          if not license_added:
              final_lines.append(
                  ""
              )

              final_lines.append(
                  "android.accept_sdk_license = True"
              )

          spec_path.write_text(
              "\n".join(
                  final_lines
              )
              + "\n",
              encoding="utf-8",
          )

          print(
              "Bundled current HyperKit source "
              "into Android smoke project."
          )

          print(
              "Android SDK licenses will be "
              "accepted automatically in CI."
          )

          print(
              spec_path.read_text(
                  encoding="utf-8"
              )
          )
          PY

      - name: Verify bundled HyperKit source
        run: |
          test -f phase73-android-smoke/hyperkit/__init__.py
          test -f phase73-android-smoke/main.py
          test -f phase73-android-smoke/buildozer.spec

          grep \
            "requirements = python3,kivy" \
            phase73-android-smoke/buildozer.spec

          grep \
            "package.name = phase73smoke" \
            phase73-android-smoke/buildozer.spec

          grep \
            "package.domain = org.gameviz" \
            phase73-android-smoke/buildozer.spec

          grep \
            "android.archs = arm64-v8a" \
            phase73-android-smoke/buildozer.spec

          grep \
            "android.accept_sdk_license = True" \
            phase73-android-smoke/buildozer.spec

      - name: Build Android debug APK
        working-directory: phase73-android-smoke
        run: |
          echo "Starting HyperKit Android build..."

          buildozer -v android debug

      - name: Show Android build artifacts
        if: always()
        run: |
          echo "Contents of Android bin directory:"

          find \
            phase73-android-smoke/bin \
            -maxdepth 1 \
            -type f \
            -print \
            2>/dev/null || true

          echo
          echo "APK search:"

          find \
            phase73-android-smoke \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true

      - name: Upload HyperKit APK
        uses: actions/upload-artifact@v4
        with:
          name: hyperkit-phase73-android-smoke-apk
          path: phase73-android-smoke/bin/*.apk
          if-no-files-found: error
          retention-days: 7