name: Phase 73 Android Smoke APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/phase73-android-mobile

jobs:
  build-android:
    name: Build HyperKit Android Smoke APK
    runs-on: ubuntu-24.04

    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android build prerequisites
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            python3-virtualenv \
            sudo \
            unzip \
            wget \
            zip \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            gettext

      - name: Verify libtool prerequisites
        run: |
          grep -R "LT_SYS_SYMBOL_USCORE" /usr/share/aclocal >/dev/null
          echo "libtool macro prerequisites verified."

      - name: Install Buildozer and current HyperKit
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34" buildozer
          python -m pip install -e .

          python --version
          buildozer --version
          python -c "from importlib.metadata import version; print('HyperKit', version('gameviz-hyperkit'))"

      - name: Generate HyperKit Android smoke project
        run: |
          rm -rf phase73-android-smoke

          hyperkit new phase73-android-smoke \
            --template tap-counter

          hyperkit init-android \
            --path phase73-android-smoke \
            --title "HyperKit Phase 73" \
            --package-name phase73smoke \
            --package-domain org.gameviz \
            --orientation portrait \
            --fullscreen \
            --permission VIBRATE \
            --arch arm64-v8a \
            --overwrite

      - name: Verify generated Android configuration
        run: |
          echo "Generated buildozer.spec:"
          cat phase73-android-smoke/buildozer.spec

          grep -F "android.api = 35" \
            phase73-android-smoke/buildozer.spec

          grep -F "android.minapi = 24" \
            phase73-android-smoke/buildozer.spec

          grep -F "android.archs = arm64-v8a" \
            phase73-android-smoke/buildozer.spec

          grep -F "android.accept_sdk_license = True" \
            phase73-android-smoke/buildozer.spec

          grep -F \
            "requirements = python3==3.11.9,hostpython3==3.11.9,kivy,gameviz-hyperkit" \
            phase73-android-smoke/buildozer.spec

      - name: Bundle current HyperKit SDK into Android project
        run: |
          cp -a src/hyperkit phase73-android-smoke/hyperkit

          python - <<'PY'
          from pathlib import Path

          spec = Path(
              "phase73-android-smoke/buildozer.spec"
          )

          lines = spec.read_text(
              encoding="utf-8"
          ).splitlines()

          updated = []

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("requirements ="):
                  line = (
                      "requirements = "
                      "python3==3.11.9,"
                      "hostpython3==3.11.9,"
                      "kivy"
                  )

              updated.append(line)

          spec.write_text(
              "\n".join(updated) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify bundled HyperKit source
        run: |
          test -d phase73-android-smoke/hyperkit
          test -f phase73-android-smoke/hyperkit/__init__.py

          grep -F \
            "requirements = python3==3.11.9,hostpython3==3.11.9,kivy" \
            phase73-android-smoke/buildozer.spec

          if grep -Eq \
            '^requirements =.*gameviz-hyperkit' \
            phase73-android-smoke/buildozer.spec
          then
            echo "Android build is still depending on public gameviz-hyperkit."
            exit 1
          fi

          grep -F "android.api = 35" \
            phase73-android-smoke/buildozer.spec

          grep -F "android.minapi = 24" \
            phase73-android-smoke/buildozer.spec

          grep -F "android.archs = arm64-v8a" \
            phase73-android-smoke/buildozer.spec

          grep -F "android.accept_sdk_license = True" \
            phase73-android-smoke/buildozer.spec

      - name: Build Android debug APK
        working-directory: phase73-android-smoke
        run: |
          echo "Starting HyperKit Android build..."
          echo "Target Android API: 35"
          echo "Minimum Android API: 24"
          echo "Architecture: arm64-v8a"
          echo "Android Python: 3.11.9"
          echo "Android host Python: 3.11.9"

          buildozer -v android debug

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find phase73-android-smoke \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(
            find phase73-android-smoke/bin \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: hyperkit-phase73-android-smoke-apk
          path: phase73-android-smoke/bin/*.apk
          if-no-files-found: error