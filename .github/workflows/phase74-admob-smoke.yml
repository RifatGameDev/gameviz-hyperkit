name: Phase 74 AdMob Smoke APK

on:
  workflow_dispatch:

  push:
    branches:
      - feature/phase74-ads-analytics-game-systems
    paths:
      - ".github/workflows/phase74-admob-smoke.yml"

jobs:
  build-admob-smoke:
    name: Build AdMob Smoke APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android build prerequisites
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            python3-virtualenv \
            sudo \
            unzip \
            wget \
            zip \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            gettext

      - name: Install Buildozer and current HyperKit
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34" buildozer
          python -m pip install -e .

          python --version
          buildozer --version

          python -c "from importlib.metadata import version; print('HyperKit', version('gameviz-hyperkit'))"

      - name: Generate AdMob smoke project
        run: |
          rm -rf phase74-admob-smoke

          hyperkit new phase74-admob-smoke \
            --template tap-counter

          hyperkit init-android \
            --path phase74-admob-smoke \
            --title "HyperKit Phase 74 AdMob" \
            --package-name phase74admobsmoke \
            --package-domain org.gameviz \
            --orientation portrait \
            --fullscreen \
            --permission VIBRATE \
            --arch arm64-v8a \
            --overwrite

          hyperkit init-admob \
            --path phase74-admob-smoke

          cp examples/phase74_admob_smoke/main.py \
            phase74-admob-smoke/main.py

      - name: Bundle current HyperKit source
        run: |
          cp -a src/hyperkit phase74-admob-smoke/hyperkit

          python - <<'PY'
          from pathlib import Path

          spec = Path(
              "phase74-admob-smoke/buildozer.spec"
          )

          lines = spec.read_text(
              encoding="utf-8"
          ).splitlines()

          updated = []

          for line in lines:
              stripped = line.strip()

              if stripped.startswith(
                  "requirements ="
              ):
                  key, value = line.split(
                      "=",
                      1,
                  )

                  items = [
                      item.strip()
                      for item in value.split(",")
                      if item.strip()
                  ]

                  items = [
                      item
                      for item in items
                      if item
                      != "gameviz-hyperkit"
                  ]

                  line = (
                      key.rstrip()
                      + " = "
                      + ",".join(items)
                  )

              updated.append(line)

          spec.write_text(
              "\n".join(updated) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify AdMob Android configuration
        run: |
          SPEC="phase74-admob-smoke/buildozer.spec"

          cat "$SPEC"

          grep -F "android.api = 35" "$SPEC"
          grep -F "android.minapi = 24" "$SPEC"
          grep -F "android.archs = arm64-v8a" "$SPEC"
          grep -F "android.accept_sdk_license = True" "$SPEC"

          grep -F "pyjnius" "$SPEC"
          grep -F "android.permissions = VIBRATE,INTERNET,ACCESS_NETWORK_STATE" "$SPEC"
          grep -F "android.gradle_dependencies = com.google.android.gms:play-services-ads:25.5.0" "$SPEC"
          grep -F "android.enable_androidx = True" "$SPEC"
          grep -F "android.add_src = android_src" "$SPEC"
          grep -F "com.google.android.gms.ads.APPLICATION_ID=ca-app-pub-3940256099942544~3347511713" "$SPEC"

          test -f \
            phase74-admob-smoke/android_src/org/gameviz/hyperkit/ads/HyperKitAdMob.java

          test -f \
            phase74-admob-smoke/hyperkit/ads/admob.py

          if grep -Eq \
            '^requirements =.*gameviz-hyperkit' \
            "$SPEC"
          then
            echo "Cloud build still depends on public gameviz-hyperkit."
            exit 1
          fi

      - name: Build Android debug APK
        working-directory: phase74-admob-smoke
        run: |
          echo "Starting HyperKit Phase 74 AdMob Android build..."
          buildozer -v android debug

      - name: Find generated APK
        run: |
          find phase74-admob-smoke/bin \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(
            find phase74-admob-smoke/bin \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: hyperkit-phase74-admob-smoke-apk
          path: phase74-admob-smoke/bin/*.apk
          if-no-files-found: error
          retention-days: 7
