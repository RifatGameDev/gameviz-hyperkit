name: HyperKit CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run automated tests
        run: pytest -q

      - name: Validate frozen public API
        run: hyperkit api-freeze-check

      - name: Validate stable release certification
        run: hyperkit stable-release-check

      - name: Validate built-in templates
        run: hyperkit validate-templates

      - name: Validate complete games
        run: hyperkit validate-complete-games

      - name: Validate generated projects
        run: hyperkit validate-generated-projects

      - name: Run release readiness check
        run: hyperkit release-check

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e .

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package artifacts
        run: python -m twine check dist/*

      - name: Verify distribution structure
        run: hyperkit verify-dist

      - name: Generate release checksums and manifest
        run: hyperkit release-manifest --source-commit "$GITHUB_SHA"

      - name: Verify clean wheel installation
        run: hyperkit verify-clean-install

      - name: Upload verified distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hyperkit-python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/release-manifest.json
          if-no-files-found: error
