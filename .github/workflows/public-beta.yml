name: HyperKit Public Beta

on:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish the verified beta bundle to TestPyPI
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  beta-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install HyperKit development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full regression suite
        run: pytest -q

      - name: Validate frozen public API
        run: hyperkit api-freeze-check

      - name: Run SDK validation gates
        run: |
          hyperkit health
          hyperkit validate-templates
          hyperkit validate-complete-games
          hyperkit validate-generated-projects
          hyperkit release-check
          hyperkit pre-release-audit

  beta-package:
    runs-on: ubuntu-latest
    needs: beta-test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate beta package identity
        run: |
          python -c "import hyperkit; assert hyperkit.__version__.startswith('0.9.0b')"
          python -c "import hyperkit; assert hyperkit.API_VERSION == '1.0'"
          hyperkit api-freeze-check
          hyperkit publish-check --target testpypi

      - name: Configure deterministic build inputs
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "PYTHONHASHSEED=0" >> "$GITHUB_ENV"

      - name: Build clean beta distributions
        run: |
          rm -rf build dist *.egg-info src/*.egg-info
          python -m build

      - name: Validate beta distributions
        run: |
          python -m twine check dist/*
          hyperkit verify-dist
          hyperkit release-manifest --source-commit "$GITHUB_SHA"
          hyperkit verify-clean-install

      - name: Upload verified beta bundle
        uses: actions/upload-artifact@v4
        with:
          name: hyperkit-public-beta-bundle
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 30

  publish-testpypi:
    if: ${{ inputs.publish_testpypi == true }}
    needs: beta-package
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download verified beta bundle
        uses: actions/download-artifact@v4
        with:
          name: hyperkit-public-beta-bundle
          path: dist

      - name: Prepare package-only upload directory
        run: |
          mkdir -p publish-dist
          cp dist/*.whl publish-dist/
          cp dist/*.tar.gz publish-dist/

      - name: Publish beta to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: publish-dist/
          skip-existing: false
          verbose: true
