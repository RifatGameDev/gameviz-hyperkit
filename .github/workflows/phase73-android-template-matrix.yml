name: Phase 73 Android Template Matrix

on:
  workflow_dispatch:

jobs:
  build-android-template:
    name: Build ${{ matrix.template }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 5

      matrix:
        include:
          - template: flappy-mini
            project: phase73-flappy-mini
            package: phase73flappymini
            title: HyperKit Flappy Mini

          - template: swipe-runner
            project: phase73-swipe-runner
            package: phase73swiperunner
            title: HyperKit Swipe Runner

          - template: puzzle-game
            project: phase73-puzzle-game
            package: phase73puzzlegame
            title: HyperKit Puzzle Game

          - template: quiz-game
            project: phase73-quiz-game
            package: phase73quizgame
            title: HyperKit Quiz Game

          - template: simple-physics
            project: phase73-simple-physics
            package: phase73simplephysics
            title: HyperKit Simple Physics

    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android build prerequisites
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            curl

          java -version

      - name: Install Buildozer and current HyperKit
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34" buildozer
          python -m pip install -e .

          python --version
          buildozer --version

          python -c "from importlib.metadata import version; print('HyperKit', version('gameviz-hyperkit'))"

      - name: Generate HyperKit project
        run: |
          hyperkit new "${{ matrix.project }}" \
            --template "${{ matrix.template }}"

          test -f "${{ matrix.project }}/main.py"
          test -f "${{ matrix.project }}/hyperkit.toml"

      - name: Generate Android configuration
        run: |
          hyperkit init-android \
            --path "${{ matrix.project }}" \
            --title "${{ matrix.title }}" \
            --package-name "${{ matrix.package }}" \
            --package-domain org.gameviz \
            --orientation portrait \
            --fullscreen \
            --permission VIBRATE \
            --arch arm64-v8a \
            --overwrite

      - name: Verify generated Android configuration
        working-directory: ${{ matrix.project }}
        run: |
          echo "Template: ${{ matrix.template }}"
          echo "Package: org.gameviz.${{ matrix.package }}"

          grep -F "android.api = 35" buildozer.spec
          grep -F "android.minapi = 24" buildozer.spec
          grep -F "android.archs = arm64-v8a" buildozer.spec
          grep -F "android.accept_sdk_license = True" buildozer.spec

          grep -F \
            "requirements = python3==3.11.9,hostpython3==3.11.9,kivy,gameviz-hyperkit" \
            buildozer.spec

      - name: Bundle current HyperKit SDK
        run: |
          cp -a src/hyperkit "${{ matrix.project }}/hyperkit"

          test -f "${{ matrix.project }}/hyperkit/__init__.py"

      - name: Use bundled HyperKit source for cloud build
        working-directory: ${{ matrix.project }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          text = path.read_text(encoding="utf-8")

          old = (
              "requirements = "
              "python3==3.11.9,"
              "hostpython3==3.11.9,"
              "kivy,"
              "gameviz-hyperkit"
          )

          new = (
              "requirements = "
              "python3==3.11.9,"
              "hostpython3==3.11.9,"
              "kivy"
          )

          if old not in text:
              raise SystemExit(
                  "Expected generated HyperKit requirements line was not found."
              )

          text = text.replace(
              old,
              new,
              1,
          )

          path.write_text(
              text,
              encoding="utf-8",
          )

          print(
              "Cloud requirements switched to bundled HyperKit source."
          )
          PY

          grep -F \
            "requirements = python3==3.11.9,hostpython3==3.11.9,kivy" \
            buildozer.spec

          if grep -Fq "gameviz-hyperkit" buildozer.spec; then
            echo "Public HyperKit requirement still exists."
            exit 1
          fi

      - name: Build Android debug APK
        working-directory: ${{ matrix.project }}
        run: |
          echo "Starting Android build..."
          echo "Template: ${{ matrix.template }}"
          echo "Android API: 35"
          echo "Minimum Android API: 24"
          echo "Architecture: arm64-v8a"
          echo "Android Python: 3.11.9"
          echo "Android host Python: 3.11.9"

          buildozer -v android debug

      - name: Show generated APK
        if: success()
        working-directory: ${{ matrix.project }}
        run: |
          echo "Generated APK files:"
          find bin -maxdepth 1 -type f -name "*.apk" -print

          APK_COUNT="$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)"

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "No APK was generated."
            exit 1
          fi

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hyperkit-${{ matrix.template }}-android-apk
          path: ${{ matrix.project }}/bin/*.apk
          if-no-files-found: error
          retention-days: 7