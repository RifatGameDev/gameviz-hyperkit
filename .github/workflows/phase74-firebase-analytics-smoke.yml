name: Phase 74 Firebase Analytics Smoke APK

on:
  workflow_dispatch:

  push:
    branches:
      - feature/phase74-ads-analytics-game-systems
    paths:
      - ".github/workflows/phase74-firebase-analytics-smoke.yml"

jobs:
  build-firebase-analytics-smoke:
    name: Build Firebase Analytics Smoke APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android build prerequisites
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            python3-virtualenv \
            sudo \
            unzip \
            wget \
            zip \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            gettext

      - name: Install Buildozer and current HyperKit
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34" buildozer
          python -m pip install -e .

          python --version
          buildozer --version

          python -c "from importlib.metadata import version; print('HyperKit', version('gameviz-hyperkit'))"

      - name: Generate Firebase Analytics smoke project
        run: |
          rm -rf phase74-firebase-analytics-smoke

          hyperkit new phase74-firebase-analytics-smoke \
            --template tap-counter

          hyperkit init-android \
            --path phase74-firebase-analytics-smoke \
            --title "HyperKit Phase 74 Firebase Analytics" \
            --package-name phase74analyticssmoke \
            --package-domain org.gameviz \
            --orientation portrait \
            --fullscreen \
            --permission VIBRATE \
            --arch arm64-v8a \
            --overwrite

          hyperkit init-firebase-analytics \
            --path phase74-firebase-analytics-smoke

          cp examples/phase74_firebase_analytics_smoke/main.py \
            phase74-firebase-analytics-smoke/main.py

      - name: Restore Firebase configuration
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          value = os.environ.get(
              "FIREBASE_GOOGLE_SERVICES_JSON_B64",
              "",
          ).strip()

          if not value:
              raise SystemExit(
                  "Missing FIREBASE_GOOGLE_SERVICES_JSON_B64 repository secret."
              )

          destination = Path(
              "phase74-firebase-analytics-smoke/google-services.json"
          )

          destination.write_bytes(
              base64.b64decode(value)
          )

          print(
              "Firebase configuration restored for cloud build."
          )
          PY

      - name: Validate Firebase configuration
        run: |
          python - <<'PY'
          from hyperkit.analytics.firebase import (
              load_firebase_analytics_config,
          )

          config = load_firebase_analytics_config(
              "phase74-firebase-analytics-smoke/google-services.json",
              package_name="org.gameviz.phase74analyticssmoke",
          )

          print(
              "Firebase project:",
              config.project_id,
          )

          print(
              "Firebase application ID:",
              config.application_id,
          )
          PY

      - name: Bundle current HyperKit source
        run: |
          cp -a src/hyperkit \
            phase74-firebase-analytics-smoke/hyperkit

          python - <<'PY'
          from pathlib import Path

          spec = Path(
              "phase74-firebase-analytics-smoke/buildozer.spec"
          )

          lines = spec.read_text(
              encoding="utf-8"
          ).splitlines()

          updated = []

          for line in lines:
              stripped = line.strip()

              if stripped.startswith(
                  "requirements ="
              ):
                  key, value = line.split(
                      "=",
                      1,
                  )

                  items = [
                      item.strip()
                      for item in value.split(",")
                      if item.strip()
                  ]

                  items = [
                      item
                      for item in items
                      if item
                      != "gameviz-hyperkit"
                  ]

                  line = (
                      key.rstrip()
                      + " = "
                      + ",".join(items)
                  )

              updated.append(line)

          spec.write_text(
              "\n".join(updated) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify Firebase Analytics Android configuration
        run: |
          SPEC="phase74-firebase-analytics-smoke/buildozer.spec"

          cat "$SPEC"

          grep -F "android.api = 35" "$SPEC"
          grep -F "android.minapi = 24" "$SPEC"
          grep -F "android.archs = arm64-v8a" "$SPEC"
          grep -F "android.accept_sdk_license = True" "$SPEC"

          grep -F "pyjnius" "$SPEC"
          grep -F "android.permissions = VIBRATE,INTERNET,ACCESS_NETWORK_STATE" "$SPEC"
          grep -F "android.gradle_dependencies = com.google.firebase:firebase-analytics:23.2.0" "$SPEC"
          grep -F "android.enable_androidx = True" "$SPEC"
          grep -F "android.add_src = android_src" "$SPEC"

          test -f \
            phase74-firebase-analytics-smoke/android_src/org/gameviz/hyperkit/analytics/HyperKitFirebaseAnalytics.java

          test -f \
            phase74-firebase-analytics-smoke/google-services.json

          test -f \
            phase74-firebase-analytics-smoke/hyperkit/analytics/firebase.py

          if grep -Eq \
            '^requirements =.*gameviz-hyperkit' \
            "$SPEC"
          then
            echo "Cloud build still depends on public gameviz-hyperkit."
            exit 1
          fi

      - name: Build Android debug APK
        working-directory: phase74-firebase-analytics-smoke
        run: |
          echo "Starting HyperKit Phase 74 Firebase Analytics Android build..."
          buildozer -v android debug

      - name: Find generated APK
        run: |
          find phase74-firebase-analytics-smoke/bin \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(
            find phase74-firebase-analytics-smoke/bin \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: hyperkit-phase74-firebase-analytics-smoke-apk
          path: phase74-firebase-analytics-smoke/bin/*.apk
          if-no-files-found: error
          retention-days: 7
